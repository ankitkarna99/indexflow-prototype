# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: snx-baskets-hyperindex
description: SNX baskets multichain indexer on Envio HyperIndex

contracts:
  - name: BasketFactory
    abi_file_path: ./abis/BasketFactory.json
    handler: ./src/EventHandlers.ts
    events:
      - event: BasketCreated

  - name: BasketVault
    abi_file_path: ./abis/BasketVault.json
    handler: ./src/EventHandlers.ts
    events:
      - event: Deposited
      - event: Redeemed
      - event: AllocatedToPerp
      - event: WithdrawnFromPerp
      - event: AssetsUpdated
      - event: FeesCollected
      - event: ReservePolicyUpdated
      - event: ReserveToppedUp

  - name: VaultAccounting
    abi_file_path: ./abis/VaultAccounting.json
    handler: ./src/EventHandlers.ts
    events:
      - event: VaultRegistered
      - event: VaultDeregistered
      - event: AssetTokenMapped
      - event: CapitalDeposited
      - event: CapitalWithdrawn
      - event: PositionOpened
      - event: PositionClosed
      - event: PnLRealized
      - event: MaxOpenInterestSet
      - event: MaxPositionSizeSet
      - event: PauseToggled

  - name: OracleAdapter
    abi_file_path: ./abis/OracleAdapter.json
    handler: ./src/EventHandlers.ts
    events:
      - event: AssetConfigured
      - event: AssetRemoved
      - event: PriceUpdated

  - name: StateRelay
    abi_file_path: ./abis/StateRelay.json
    handler: ./src/EventHandlers.ts
    events:
      - event: StateUpdated

networks:
  - id: 11155111 # Sepolia (hub)
    start_block: 10990585
    contracts:
      - name: BasketFactory
        address: 0x0477db0b9630112c93732c7aa00a56fa07eee50d
        start_block: 10990585
      - name: VaultAccounting
        address: 0x2322b6489bfc7e566bad500efbcff1efedfe35ff
        start_block: 10990585
      - name: OracleAdapter
        address: 0x0ebf41fb716b5f3dc9f6cfb40216559d0c1c2c5f
        start_block: 10990585
      - name: StateRelay
        address: 0x911f254fc534c772bfb6e05a4a9f583af9a384eb
        start_block: 10990585
      - name: BasketVault

  - id: 43113 # Avalanche Fuji (spoke — only BasketFactory + StateRelay emit events)
    start_block: 56033380
    contracts:
      - name: BasketFactory
        address: 0xa266ebcac01641743221c5e25be2316e0a141d17
        start_block: 56033380
      - name: StateRelay
        address: 0x2e106369e5a2f1f446e7cdf39ab9d22e39a0e9e6
        start_block: 56033380
      - name: BasketVault

  - id: 5003 # Mantle Sepolia (hub) — NOT in HyperSync (only Mantle mainnet 5000 is),
    # so we MUST use RPC as the primary sync data-source. Without this `rpc:` block
    # the Envio Cloud build fails closed (404 endpoint, no build/runtime logs).
    rpc:
      - url: https://rpc.sepolia.mantle.xyz
        for: sync
        initial_block_interval: 1000
        interval_ceiling: 2000
        query_timeout_millis: 20000
    start_block: 39532704
    contracts:
      - name: BasketFactory
        address: 0x12b820aa2dd1ba91753cfec69a21ddee0373f739
        start_block: 39532704
      - name: VaultAccounting
        address: 0x180d5beca352abcd886e5356b7293a4faf620c40
        start_block: 39532704
      - name: OracleAdapter
        address: 0xb17658411a2734538fe85ce7c268323c8c2d4617
        start_block: 39532704
      - name: StateRelay
        address: 0x0ebf41fb716b5f3dc9f6cfb40216559d0c1c2c5f
        start_block: 39532704
      - name: BasketVault

unordered_multichain_mode: true
preload_handlers: false
address_format: lowercase
